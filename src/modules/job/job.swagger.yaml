tags:
  - name: JOB
    description: API lowongan pekerjaan

/api/jobs:
  get:
    summary: Daftar lowongan aktif (pencarian menampilkan semua, termasuk yang sudah dilamar)
    tags: [JOB]
    security:
      - bearerAuth: []
    parameters:
      - name: search
        in: query
        schema: { type: string }
      - name: type
        in: query
        schema: { type: string, example: "fulltime" }
      - name: location
        in: query
        schema: { type: string }
    responses:
      200:
        description: Daftar lowongan aktif
  post:
    summary: Buat lowongan baru (HRD, perusahaan harus verified)
    tags: [JOB]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, department, location, requirements]
            properties:
              title: { type: string, example: "Backend Developer" }
              department: { type: string, example: "Technology" }
              type: { type: string, example: "fulltime" }
              location: { type: string, example: "Jakarta" }
              description: { type: string, description: "Opsional" }
              salaryMin: { type: integer }
              salaryMax: { type: integer }
              requirements:
                type: array
                description: >
                  Detail persyaratan. Satu item = satu tanggung jawab.
                  Keahlian disimpan di DB sebagai satu kolom dipisah koma.
                minItems: 1
                items:
                  type: object
                  required: [requirement, skills]
                  properties:
                    requirement:
                      type: string
                      example: "Membangun dan memelihara REST API"
                    skills:
                      type: array
                      items: { type: string }
                      example: ["Node.js", "Express", "REST API"]
    responses:
      201:
        description: Lowongan dibuat (JobSkill terisi otomatis, weight = frekuensi skill)
      403:
        description: Perusahaan belum diverifikasi / bukan HRD

/api/jobs/mine:
  get:
    summary: Lowongan milik perusahaan (HRD)
    tags: [JOB]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Daftar lowongan perusahaan

/api/jobs/{id}:
  get:
    summary: Detail lowongan (termasuk requirements)
    tags: [JOB]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      200:
        description: Detail lowongan
      404:
        description: Lowongan tidak ditemukan
  patch:
    summary: Update lowongan (HRD, pemilik)
    description: Bila `requirements` dikirim, seluruh persyaratan & skill disinkronkan ulang.
    tags: [JOB]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              department: { type: string }
              type: { type: string }
              location: { type: string }
              description: { type: string }
              salaryMin: { type: integer }
              salaryMax: { type: integer }
              status: { type: string, example: "active" }
              requirements:
                type: array
                items:
                  type: object
                  properties:
                    requirement: { type: string }
                    skills:
                      type: array
                      items: { type: string }
    responses:
      200:
        description: Lowongan diperbarui
  delete:
    summary: Hapus lowongan (HRD, pemilik)
    tags: [JOB]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      200:
        description: Lowongan dihapus

/api/jobs/{id}/close:
  patch:
    summary: Tutup lowongan (HRD, pemilik)
    tags: [JOB]
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      200:
        description: Lowongan ditutup